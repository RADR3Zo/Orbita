# Publica una actualización de Órbita.
#
# Cómo usarlo:
#   1. Sube orbita_version en gradle.properties (por ejemplo 1.5.5), escribe las novedades
#      en novedades/1.5.5.md y haz commit.
#   2. Crea una etiqueta con esa versión y súbela:
#        git tag v1.5.5
#        git push origin v1.5.5
#   3. GitHub compila todo en Windows y crea la release con el .zip, el .jar y su .sha256.
#      Los launchers que ya están instalados la detectan solos al abrirse.
#
# Si en las notas de la release escribes [completa], el launcher pedirá descargar el .zip
# entero en vez de actualizarse solo (úsalo si cambias el Java incluido o algo fuera del .jar).
name: Publicar release

on:
  push:
    tags:
      - 'v*'
    # También se puede publicar subiendo a la rama "release" (la etiqueta vX.Y.Z se crea sola):
    #   git push origin main:release
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (el que va dentro de Orbita.exe)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java 25 (para ejecutar Gradle/Loom)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Comprobar que la etiqueta coincide con gradle.properties
        shell: pwsh
        run: |
          $version = (Select-String -Path gradle.properties -Pattern '^orbita_version=(.+)$').Matches[0].Groups[1].Value.Trim()
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($version -ne $tag) {
              throw "La etiqueta es v$tag pero gradle.properties dice orbita_version=$version. Cambia uno de los dos."
            }
          } else {
            # Desde la rama release: no se puede publicar dos veces la misma versión
            git fetch --tags --quiet
            if (git tag --list "v$version") {
              throw "La versión $version ya está publicada. Sube orbita_version en gradle.properties."
            }
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compilar, probar y empaquetar
        shell: pwsh
        run: ./build.ps1 -JavaHome '${{ steps.jdk21.outputs.path }}' -GradleJavaHome '${{ steps.jdk25.outputs.path }}' -GithubRepo '${{ github.repository }}'

      - name: Preparar las novedades
        shell: pwsh
        run: |
          # Las novedades salen de novedades/<versión>.md (es lo que ve la gente al actualizar).
          $file = "novedades/$env:VERSION.md"
          if (Test-Path $file) { Copy-Item $file dist/novedades.md }
          else { Set-Content dist/novedades.md "Órbita $env:VERSION" -Encoding utf8 }

      - name: Crear la release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Órbita ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: dist/novedades.md
          files: |
            dist/Orbita-${{ env.VERSION }}-windows-x64.zip
            dist/orbita-launcher-${{ env.VERSION }}.jar
            dist/orbita-launcher-${{ env.VERSION }}.jar.sha256
